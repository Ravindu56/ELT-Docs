<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Summary - Prof. A. Thurairajah Memorial Cricket Tournament 2K26</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
:root{--font-display:'Outfit',Arial,sans-serif;--font-body:'Inter',Arial,sans-serif;--bg-space:#0b0f19;--bg-space-secondary:#0f172a;--bg-card-solid:#0f172a;--bg-card:rgba(15,23,42,.75);--bg-card-border:rgba(148,163,184,.12);--bg-card-border-hover:rgba(59,130,246,.4);--text-main:#f8fafc;--text-secondary:#cbd5e1;--text-muted:#94a3b8;--accent-primary:#3b82f6;--accent-cyan:#38bdf8;--accent-primary-subtle:rgba(59,130,246,.14)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg-space);color:var(--text-main);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1,h2{font-family:var(--font-display)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}.toolbar button,.toolbar select,.toolbar a{font:600 14px var(--font-body);border:1px solid var(--bg-card-border-hover);border-radius:8px;padding:8px 16px;color:var(--text-main);background:var(--bg-card-solid);text-decoration:none;cursor:pointer}.toolbar button{background:var(--accent-primary)}.wrap{position:relative}.stage{width:1376px;transform-origin:0 0}.poster{position:relative;width:1376px;min-height:768px;overflow:hidden;padding:35px 0 34px 30px;background:var(--bg-space)}.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 0%,rgba(37,99,235,.16),transparent 55%)}.stadium{position:absolute;top:0;right:0;width:400px;height:100%;background:var(--bg-space-secondary);overflow:hidden}.stadium svg{position:absolute;inset:0;width:100%;height:100%}.stadium::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-space),transparent 35%);pointer-events:none}.brand{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 26px 0 44px}.brand::before{content:'';position:absolute;inset:-40px 0;z-index:-1;background:radial-gradient(ellipse,rgba(11,15,25,.9),transparent 72%)}.brand-logo{width:300px;max-height:300px;object-fit:contain;filter:drop-shadow(0 8px 12px #0009) drop-shadow(0 0 22px #38bdf870)}.brand-year{margin-top:1px;font:800 36px var(--font-display);letter-spacing:6px;padding-left:6px}.brand-sub{margin-top:10px;font:600 11px var(--font-display);letter-spacing:3px;color:var(--accent-cyan)}.content{position:relative;width:940px;display:flex;flex-direction:column;gap:20px}.header{min-height:132px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 26px 0 28px;background:#f8fafc;border-left:8px solid var(--accent-primary);border-radius:4px;color:#0f172a}.titles h1{font-size:58px;font-weight:900;line-height:1;letter-spacing:.5px}.titles h2{font-size:27px;font-weight:700;margin-top:8px;line-height:1.15;color:#1e293b}.match-badge{flex-shrink:0;text-align:center;padding:14px 18px;border-radius:10px;background:var(--bg-card-solid);border:2px solid var(--accent-primary)}.match-badge small{display:block;font:600 16px var(--font-display);letter-spacing:4px;color:var(--text-muted)}.match-badge b{display:block;font:900 28px var(--font-display);line-height:1.2;color:var(--accent-cyan)}.match-caption{padding:12px 18px;background:var(--accent-primary-subtle);border-left:4px solid var(--accent-primary);border-radius:6px}#fixtureTitle{font:800 24px var(--font-display)}#tossLine{font-size:16px;font-weight:600;line-height:1.4;color:var(--text-secondary);margin-top:5px}.card{position:relative;border-radius:14px;padding:10px;overflow:hidden;background:var(--bg-card);border:1px solid var(--bg-card-border-hover);box-shadow:0 10px 30px #0007,0 0 22px #3b82f647}.card::before,.card::after{content:'';position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent)}.card::before{top:0}.card::after{bottom:0}.card-in{display:flex;align-items:center;gap:22px;padding:14px 14px 14px 18px;min-height:196px;border-radius:10px;background:var(--bg-card-solid);border:1px solid var(--bg-card-border)}.team-logo{position:relative;flex:0 0 150px;width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--bg-space);border:4px solid var(--accent-primary);box-shadow:0 0 20px #3b82f670;display:flex;align-items:center;justify-content:center;text-align:center;font:800 20px var(--font-display)}.team-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(var(--zoom,1));display:block}.card-body{flex:1;min-width:0}.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}.team-name{font:800 32px var(--font-display);letter-spacing:.5px}.team-subtitle{display:block;font:600 13px var(--font-body);color:var(--text-muted);letter-spacing:1px;margin-top:2px}.score{font:800 36px var(--font-display);text-align:center}.overs{font:600 24px var(--font-display);color:var(--text-muted);white-space:nowrap}.overs b{font-size:32px;color:var(--accent-cyan);margin-left:6px}.tables{display:flex;gap:22px;padding:8px 12px;border-radius:8px;background:rgba(30,41,59,.55);border:1px solid var(--bg-card-border)}.tbl{flex:1;min-width:0}table{border-collapse:collapse;width:100%;table-layout:fixed}th{font:700 16px var(--font-display);text-align:left;color:var(--text-muted);letter-spacing:.8px;padding-bottom:4px;border-bottom:3px solid var(--accent-primary);white-space:nowrap}td{font-size:18px;font-weight:600;line-height:1.3;padding:5px 4px;border-bottom:1px solid var(--bg-card-border);overflow-wrap:break-word}th.n,td.n{text-align:center}td.n{font:700 20px var(--font-display);color:var(--accent-cyan);white-space:nowrap}.w-runs,.w-balls,.w-ov{width:52px}.w-fig{width:66px}.gap{width:8px;border-bottom:none!important;padding:0!important}.result{height:66px;display:flex;align-items:center;justify-content:flex-end;padding:0 20px;background:var(--accent-primary-subtle);border:1px solid var(--bg-card-border-hover);border-left:8px solid var(--accent-primary);border-radius:6px}.result span{font:800 32px var(--font-display);letter-spacing:.5px;color:var(--text-secondary)}.result em{font-style:normal;color:var(--accent-cyan)}@media print{body{padding:0;background:none}.toolbar{display:none}.stage{transform:none!important}@page{margin:0}}
</style>
</head>
<body>

<div class="toolbar">
  <a href="match-summary.html">League summaries</a><a href="points-table.html">Points table</a><select id="picker" onchange="setMatch(this.value)"></select>
  <button onclick="downloadPNG()">Download PNG</button>
  <button onclick="downloadPDF()">Save as PDF</button>
</div>

<div class="wrap" id="wrap">
<div class="stage" id="stage">
<div class="poster" id="poster">
  <div class="glow"></div>

  <div class="stadium">
    <svg viewBox="0 0 400 768" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
        <radialGradient id="flood" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="768" fill="url(#sky)"/>
      <circle cx="320" cy="50" r="120" fill="url(#flood)"/>
      <path d="M-20 150 Q90 110 180 280" stroke="#334155" stroke-width="26" fill="none" opacity=".45"/>
      <rect x="330" y="70" width="6" height="250" fill="#475569"/>
      <rect x="300" y="14" width="66" height="60" rx="5" fill="#64748b"/>
      <g fill="#e2e8f0">
        <circle cx="312" cy="28" r="4.5"/><circle cx="329" cy="28" r="4.5"/><circle cx="346" cy="28" r="4.5"/><circle cx="359" cy="28" r="4.5"/>
        <circle cx="312" cy="44" r="4.5"/><circle cx="329" cy="44" r="4.5"/><circle cx="346" cy="44" r="4.5"/><circle cx="359" cy="44" r="4.5"/>
        <circle cx="312" cy="60" r="4.5"/><circle cx="329" cy="60" r="4.5"/><circle cx="346" cy="60" r="4.5"/><circle cx="359" cy="60" r="4.5"/></g>
      <polygon points="270,270 400,240 400,330 270,340" fill="#1e293b"/>
      <polygon points="170,290 270,270 270,340 170,360" fill="#334155"/>
      <polygon points="0,380 120,340 240,370 240,410 0,420" fill="#475569"/>
      <rect x="0" y="410" width="400" height="60" fill="#3b4a63"/>
      <rect x="0" y="470" width="400" height="40" fill="#334155"/>
      <polygon points="0,510 400,470 400,560 0,590" fill="#3f4e68"/>
      <path d="M0 600 Q220 580 400 500 L400 768 L0 768Z" fill="#2b3a52"/>
      <path d="M0 650 Q230 640 400 560" stroke="#3b82f6" stroke-width="2" fill="none" opacity=".5"/>
    </svg>

    <div class="brand">
      <img class="brand-logo" id="brandLogo" alt="Tournament logo">
      <div class="brand-year" id="brandYear"></div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
  </div>

  <div class="content">
    <div class="header">
      <div class="titles">
        <h1>MATCH SUMMARY</h1>
        <h2 id="tName"></h2>
      </div>
      <div class="match-badge"><small>MATCH</small><b id="matchNo"></b></div>
    </div>
    <div class="match-caption"><div id="fixtureTitle"></div><div id="tossLine"></div></div>
    <div class="card" id="card1"></div>
    <div class="card" id="card2"></div>
    <div class="result"><span id="result"></span></div>
  </div>
</div>
</div>
</div>

<script>
/* ============ MATCH DATA (edit / paste new match objects here) ============ */
const TOURNAMENT = {
  name: "Prof. A. Thurairajah Memorial Cricket Tournament 2K26",
  logo: "images/tournamentLogo.png",     // transparent PNG
  year: "2K26",                          // shown under the logo
  organizer: "ORGANIZED BY E22"          // subtitle under the year
};

const LOGOS = {
  E22: "images/E22.png",
  E23: "images/E23.jpg",
  E24: "images/E24.jpg",
  E25: "images/E25.jpg"
};

/* Per-team zoom inside the circle (1 = full artwork, 1.1 = slightly tighter crop) */
const ZOOM = { E22: 1.0, E23: 1.0, E24: 1.0, E25: 1.0 };

const matches = [{"matchNo":"FINAL","label":"Final - E22 vs E23","title":"Final - E22 vs E23","toss":"E23 won the toss and elected to bowl.","filename":"final-e22-vs-e23","result":"E22 WON BY 9 RUNS","innings":[{"team":"E22","score":"162/9","overs":"20","batters":[{"name":"Kavindu Rathnayake","runs":"34","balls":"30"},{"name":"Nishan Pramodha","runs":"18","balls":"16"},{"name":"Abhishek Tharlas","runs":"17","balls":"12"},{"name":"Yashikumar","runs":"16","balls":"10"},{"name":"Ravindu Pussekumbura","runs":"16","balls":"23"},{"name":"Chirath Amuyaru","runs":"15*","balls":"6"},{"name":"Ashan Madhushanka","runs":"11","balls":"6"}],"bowlingTeam":"E23","bowlers":[{"name":"Dehan Rajanayaka","figures":"5/16","overs":"4"},{"name":"Jalitha Tharuka","figures":"1/29","overs":"4"},{"name":"Tharusha Dilhara","figures":"1/42","overs":"3"},{"name":"Adhithya Randeniya","figures":"1/32","overs":"4"}]},{"team":"E23","score":"153/9","overs":"20","batters":[{"name":"Dehan Rajanayaka","runs":"59","balls":"40"},{"name":"Adhithya Randeniya","runs":"17","balls":"12"},{"name":"Janithra Chandima","runs":"15*","balls":"6"},{"name":"Jalitha Tharuka","runs":"14","balls":"8"},{"name":"Rochana Muthukumarana","runs":"13","balls":"13"}],"bowlingTeam":"E22","bowlers":[{"name":"Nishan Pramodha","figures":"3/28","overs":"4"},{"name":"Abhishek Tharlas","figures":"3/31","overs":"4"},{"name":"Mehethuran Kujilan","figures":"2/39","overs":"5.1"},{"name":"Yashikumar","figures":"1/30","overs":"4"}]}]},{"matchNo":"SPECIAL","label":"Special - Legends vs Rising XI","title":"Special Match - Legends vs Rising XI","toss":"Legends (Alumni) won the toss and elected to bat.","filename":"special-legends-vs-rising-xi","result":"RISING XI WON BY 8 WICKETS","innings":[{"team":"ALUMNI","displayName":"LEGENDS","subtitle":"Alumni","score":"116/5","overs":"20","batters":[{"name":"Krishantha Supun","runs":"47","balls":"40"},{"name":"Thisaru Rathnayaka","runs":"21","balls":"23"},{"name":"Mahesh Sanjula","runs":"17","balls":"26"},{"name":"Charith Nuwantha","runs":"11*","balls":"11"},{"name":"Kasun Prabhash","runs":"9*","balls":"11"}],"bowlingTeam":"RISING XI","bowlers":[{"name":"Kalindu Geeganage","figures":"2/18","overs":"4"},{"name":"Nishan Pramodha","figures":"1/9","overs":"2"},{"name":"Chandupa Nipun","figures":"1/14","overs":"3"},{"name":"Aflal Ahamed","figures":"1/10","overs":"2"}]},{"team":"PRESENT","displayName":"RISING XI","subtitle":"Present","score":"119/2","overs":"11.5","batters":[{"name":"Gaurawa Mihiranga","runs":"55*","balls":"41"},{"name":"Chamindu Gunasinghe","runs":"28","balls":"17"},{"name":"Kaveesh Shaluka","runs":"10","balls":"12"},{"name":"Aflal Ahamed","runs":"6*","balls":"2"}],"bowlingTeam":"LEGENDS","bowlers":[{"name":"Deshan Fernando","figures":"1/27","overs":"3"},{"name":"Mahesh Sanjula","figures":"1/7","overs":"0.5"}]}]}];
/* ========================================================================== */

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function inningsCard(t){
  const bat = t.batters.map(b =>
    `<tr><td>${esc(b.name)}</td><td class="gap"></td><td class="n">${esc(b.runs)}</td><td class="gap"></td><td class="n">${esc(b.balls)}</td></tr>`).join("");
  const bowl = t.bowlers.length
    ? t.bowlers.map(b =>
        `<tr><td>${esc(b.name)}</td><td class="gap"></td><td class="n">${esc(b.figures)}</td><td class="gap"></td><td class="n">${esc(b.overs)}</td></tr>`).join("")
    : `<tr><td class="note" colspan="5">${esc(t.bowlersNote || "-")}</td></tr>`;
  const src = t.logo || LOGOS[t.team];
  const logo = src ? `<img src="${esc(src)}" alt="${esc(t.team)}" style="--zoom:${ZOOM[t.team] || 1}">` : esc(t.displayName || t.team);
  return `
  <div class="card-in">
    <div class="team-logo">${logo}</div>
    <div class="card-body">
      <div class="top">
        <div class="team-name">${esc(t.displayName || t.team)}${t.subtitle ? `<span class="team-subtitle">${esc(t.subtitle)}</span>` : ""}</div>
        <div class="score">${esc(t.score)}</div>
        <div class="overs">OVERS <b>${esc(t.overs)}</b></div>
      </div>
      <div class="tables">
        <div class="tbl"><table>
          <tr><th>BATTERS</th><th class="gap"></th><th class="n w-runs">RUNS</th><th class="gap"></th><th class="n w-balls">BALLS</th></tr>${bat}</table></div>
        <div class="tbl"><table>
          <tr><th>BOWLERS &ndash; ${esc(t.bowlingTeam)}</th><th class="gap"></th><th class="n w-fig">FIG</th><th class="gap"></th><th class="n w-ov">OVERS</th></tr>${bowl}</table></div>
      </div>
    </div>
  </div>`;
}

let current = 0;
function render(){
  const m = matches[current];
  document.getElementById("tName").textContent = TOURNAMENT.name;
  document.getElementById("matchNo").textContent = m.matchNo;
  document.getElementById("fixtureTitle").textContent = m.title;
  document.getElementById("tossLine").textContent = m.toss;
  document.getElementById("brandLogo").src = TOURNAMENT.logo;
  document.getElementById("brandYear").textContent = TOURNAMENT.year;
  document.getElementById("brandSub").textContent = TOURNAMENT.organizer;
  document.getElementById("card1").innerHTML = inningsCard(m.innings[0]);
  document.getElementById("card2").innerHTML = inningsCard(m.innings[1]);
  document.getElementById("result").innerHTML = "RESULT: <em>" + esc(m.result) + "</em>";
  document.title = m.label + " - " + TOURNAMENT.name;
  fit();
}
function setMatch(i){ current = +i; render(); }

const picker = document.getElementById("picker");
matches.forEach((m, i) => picker.add(new Option(m.label, i)));

function fit(forcePrint){
  const s = forcePrint ? 1 : Math.min(1, (window.innerWidth - 32) / 1376);
  const stage = document.getElementById("stage"), wrap = document.getElementById("wrap");
  const h = document.getElementById("poster").offsetHeight;
  stage.style.transform = `scale(${s})`;
  wrap.style.width = 1376 * s + "px";
  wrap.style.height = h * s + "px";
}
window.addEventListener("resize", () => fit());
window.addEventListener("load", () => fit());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());
window.addEventListener("beforeprint", () => fit(true));
window.addEventListener("afterprint", () => fit());

function downloadPDF(){
  const h = document.getElementById("poster").offsetHeight;
  let st = document.getElementById("pageSize");
  if(!st){ st = document.createElement("style"); st.id = "pageSize"; document.head.appendChild(st); }
  st.textContent = `@page{size:1376px ${h}px;margin:0}`;
  window.print();
}

function downloadPNG(){
  const go = () => {
    const stage = document.getElementById("stage"), prev = stage.style.transform;
    stage.style.transform = "none";
    html2canvas(document.getElementById("poster"), {scale:2, useCORS:true, backgroundColor:null}).then(c => {
      stage.style.transform = prev;
      const a = document.createElement("a");
      a.download = matches[current].filename + ".png";
      a.href = c.toDataURL("image/png"); a.click();
    });
  };
  if (window.html2canvas) return go();
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  s.onload = go; document.head.appendChild(s);
}

render();
</script>
</body>
</html>
