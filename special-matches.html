<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final and Special Match Summaries | E-Legends</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#0b0f19;--panel:#0f172a;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--cyan:#38bdf8}
*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,a,select{font:inherit}.toolbar{max-width:1600px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.nav,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.nav a,button,select{color:var(--text);background:var(--panel);border:1px solid #334155;border-radius:10px;padding:12px 16px;text-decoration:none;font-size:14px}button{cursor:pointer;background:#2563eb;font-weight:700}button:disabled{opacity:.55;cursor:wait}.nav a:hover,button:hover{border-color:var(--cyan)}#status{max-width:1600px;margin:0 auto 16px;color:var(--muted);font-size:13px}.viewport{margin:auto;position:relative}.stage{width:1600px;transform-origin:top left}
.poster{--accent:#f5c66b;--glow:rgba(245,198,107,.13);width:1600px;min-height:1050px;padding:46px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 100% 0%,var(--glow),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(59,130,246,.12),transparent 55%),#0b0f19;color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact}.poster.special{--accent:#38bdf8;--glow:rgba(56,189,248,.14)}.poster::before{content:'';position:absolute;inset:16px;border:1px solid var(--accent);opacity:.25;pointer-events:none}.poster::after{content:'';position:absolute;right:-150px;top:150px;width:650px;height:650px;border:70px solid #ffffff03;border-radius:50%;pointer-events:none}h1,h2,h3,.number,.score,.badge,.year{font-family:Outfit,Arial,sans-serif}header{position:relative;z-index:1;display:grid;grid-template-columns:1fr 265px;gap:40px;align-items:center;border-bottom:1px solid #ffffff20;padding-bottom:30px}.eyebrow{color:var(--accent);letter-spacing:4px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center}.eyebrow::before{content:'';width:32px;height:3px;background:var(--accent)}h1{font-size:70px;line-height:1;margin:15px 0 14px;font-weight:900;letter-spacing:1px}.tournament{font-size:22px;line-height:1.45;margin:0;max-width:1060px;color:#cbd5e1}.title-row{display:flex;align-items:center;gap:22px}.badge{padding:9px 16px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-size:17px;font-weight:800;letter-spacing:3px}.brand{text-align:center}.brand img{width:245px;height:215px;object-fit:contain;filter:drop-shadow(0 8px 12px #0009)}.year{font-weight:800;font-size:30px;margin-top:0;letter-spacing:5px}.organizer{font-size:10px;letter-spacing:3px;color:var(--cyan);margin-top:8px}.match-title{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin:28px 0;gap:20px}h2{margin:0;font-size:33px;font-weight:700}.match-title span{color:var(--accent);font-size:13px;letter-spacing:3px;text-transform:uppercase}.innings-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:26px}.innings{border:1px solid #334155;border-top:4px solid var(--accent);border-radius:18px;background:linear-gradient(150deg,#172238,#0f172a);padding:26px;box-shadow:0 14px 30px #0005}.innings-label{color:var(--muted);font-size:12px;letter-spacing:3px;margin-bottom:18px}.team-header{display:flex;align-items:center;gap:18px;padding-bottom:23px;border-bottom:1px solid #ffffff16}.team-logo{width:94px;height:94px;flex:0 0 94px;overflow:hidden;border-radius:14px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;background:#0b0f19;font-family:Outfit,Arial,sans-serif;font-weight:800;font-size:18px;text-align:center}.team-logo img{width:100%;height:100%;object-fit:contain;display:block}.team{font-size:30px;font-weight:800;margin:0 0 4px;font-family:Outfit,Arial,sans-serif}.score{font-size:46px;font-weight:900;line-height:1.1;letter-spacing:1px}.overs{font-size:14px;color:#cbd5e1;margin-top:7px}.innings h3{font-size:17px;letter-spacing:2px;color:var(--accent);margin:23px 0 12px;display:flex;justify-content:space-between;align-items:center}.innings h3 small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:1px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:9px 0;border-bottom:1px solid #ffffff25}td{font-size:15px;padding:12px 0;border-bottom:1px solid #ffffff0c;line-height:1.4;overflow-wrap:anywhere}th:not(:first-child),td:not(:first-child){text-align:right;width:68px;white-space:nowrap}.number{color:var(--accent);font-size:19px;font-weight:700}td:first-child{padding-right:16px}.winner{position:relative;z-index:1;margin-top:28px;padding:24px 30px;display:flex;align-items:center;gap:24px;border-radius:14px;background:linear-gradient(110deg,var(--glow),#0f172a);border:1px solid var(--accent)}.winner svg{width:54px;height:54px;flex:0 0 54px;color:var(--accent)}.winner small{display:block;font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:6px}.winner strong{font-family:Outfit,Arial,sans-serif;font-size:36px;font-weight:800}.winner .margin{margin-left:auto;text-align:right;color:#cbd5e1;font-size:14px;line-height:1.5}.footer{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.exporting .stage{transform:none!important}
@media(max-width:650px){body{padding:12px}.toolbar{gap:12px}.nav a,button,select{font-size:12px;padding:10px}.actions{width:100%}select{max-width:100%}}
@media print{html,body{margin:0;padding:0;background:#0b0f19}.toolbar,#status{display:none!important}.viewport{width:1600px!important;height:auto!important;margin:0}.stage{transform:none!important}.poster{break-inside:avoid}.poster::after{display:none}@page{margin:0}}
</style>
</head>
<body>
<div class="toolbar"><nav class="nav" aria-label="Summary navigation"><a href="match-summary.html">League summaries</a><a href="points-table.html">Points table</a></nav><div class="actions"><select id="picker" aria-label="Select special match"></select><button id="png" type="button">Download PNG</button><button id="pdf" type="button">Save PDF</button></div></div>
<p id="status" role="status">Special-match summaries. Selected batting performances and wicket-taking bowlers; scorecard totals preserved.</p>
<div class="viewport" id="viewport"><div class="stage" id="stage"><main class="poster" id="poster"></main></div></div>
<script>
const matches = [{"matchNo":"FINAL","label":"Final - E22 vs E23","kind":"final","subtitle":"Championship match","filename":"final-e22-vs-e23","result":"E22 WON BY 9 RUNS","innings":[{"team":"E22","score":"162/9","overs":"20","batters":[{"name":"Kavindu Rathnayake","runs":"34","balls":"30"},{"name":"Nishan Pramodha","runs":"18","balls":"16"},{"name":"Abhishek Tharlas","runs":"17","balls":"12"},{"name":"Yashikumar","runs":"16","balls":"10"},{"name":"Ravindu Pussekumbura","runs":"16","balls":"23"},{"name":"Chirath Amuyaru","runs":"15*","balls":"6"},{"name":"Ashan Madhushanka","runs":"11","balls":"6"}],"bowlingTeam":"E23","bowlers":[{"name":"Dehan Rajanayaka","figures":"5/16","overs":"4"},{"name":"Jalitha Tharuka","figures":"1/29","overs":"4"},{"name":"Tharusha Dilhara","figures":"1/42","overs":"3"},{"name":"Adhithya Randeniya","figures":"1/32","overs":"4"}]},{"team":"E23","score":"153/9","overs":"20","batters":[{"name":"Dehan Rajanayaka","runs":"59","balls":"40"},{"name":"Adhithya Randeniya","runs":"17","balls":"12"},{"name":"Janithra Chandima","runs":"15*","balls":"6"},{"name":"Jalitha Tharuka","runs":"14","balls":"8"},{"name":"Rochana Muthukumarana","runs":"13","balls":"13"}],"bowlingTeam":"E22","bowlers":[{"name":"Nishan Pramodha","figures":"3/28","overs":"4"},{"name":"Abhishek Tharlas","figures":"3/31","overs":"4"},{"name":"Mehethuran Kujilan","figures":"2/39","overs":"5.1"},{"name":"Yashikumar","figures":"1/30","overs":"4"}]}]},{"matchNo":"SPECIAL","label":"Special Match - Alumni vs Present","kind":"special","subtitle":"Alumni vs Present","filename":"special-alumni-vs-present","result":"PRESENT WON BY 8 WICKETS","innings":[{"team":"ALUMNI","score":"116/5","overs":"20","batters":[{"name":"Krishantha Supun","runs":"47","balls":"40"},{"name":"Thisaru Rathnayaka","runs":"21","balls":"23"},{"name":"Mahesh Sanjula","runs":"17","balls":"26"},{"name":"Charith Nuwantha","runs":"11*","balls":"11"},{"name":"Kasun Prabhash","runs":"9*","balls":"11"}],"bowlingTeam":"PRESENT","bowlers":[{"name":"Kalindu Geeganage","figures":"2/18","overs":"4"},{"name":"Nishan Pramodha","figures":"1/9","overs":"2"},{"name":"Chandupa Nipun","figures":"1/14","overs":"3"},{"name":"Aflal Ahamed","figures":"1/10","overs":"2"}]},{"team":"PRESENT","score":"119/2","overs":"11.5","batters":[{"name":"Gaurawa Mihiranga","runs":"55*","balls":"41"},{"name":"Chamindu Gunasinghe","runs":"28","balls":"17"},{"name":"Kaveesh Shaluka","runs":"10","balls":"12"},{"name":"Aflal Ahamed","runs":"6*","balls":"2"}],"bowlingTeam":"ALUMNI","bowlers":[{"name":"Deshan Fernando","figures":"1/27","overs":"3"},{"name":"Mahesh Sanjula","figures":"1/7","overs":"0.5"}]}]}];
const logos={E22:'images/E22.png',E23:'images/E23.jpg'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0;
const trophy='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M18 8h28v16a14 14 0 0 1-28 0V8Z"/><path d="M18 12H8v8a12 12 0 0 0 12 12M46 12h10v8a12 12 0 0 1-12 12M32 38v12M22 56h20M24 50h16v6"/></svg>';
function logo(team){return logos[team]?`<img src="${esc(logos[team])}" alt="${esc(team)} logo" onerror="this.parentNode.textContent=this.alt.replace(' logo','')">`:esc(team)}
function innings(t,i){return `<section class="innings"><div class="innings-label">${i===0?'FIRST':'SECOND'} INNINGS</div><div class="team-header"><div class="team-logo">${logo(t.team)}</div><div><div class="team">${esc(t.team)}</div><div class="score">${esc(t.score)}</div><div class="overs">${esc(t.overs)} OVERS</div></div></div><h3>BATTING <small>SELECTED PERFORMANCES</small></h3><table aria-label="${esc(t.team)} batting"><thead><tr><th>BATTER</th><th>RUNS</th><th>BALLS</th></tr></thead><tbody>${t.batters.map(b=>`<tr><td>${esc(b.name)}</td><td class="number">${esc(b.runs)}</td><td>${esc(b.balls)}</td></tr>`).join('')}</tbody></table><h3>BOWLING <small>${esc(t.bowlingTeam)}</small></h3><table aria-label="${esc(t.bowlingTeam)} bowling"><thead><tr><th>BOWLER</th><th>W/R</th><th>OVERS</th></tr></thead><tbody>${t.bowlers.map(b=>`<tr><td>${esc(b.name)}</td><td class="number">${esc(b.figures)}</td><td>${esc(b.overs)}</td></tr>`).join('')}</tbody></table></section>`}
function render(){const m=matches[current];const final=m.kind==='final';document.getElementById('poster').className='poster '+m.kind;document.getElementById('poster').innerHTML=`<header><div><div class="eyebrow">${final?'CHAMPIONSHIP FINAL':'SPECIAL MATCH'}</div><div class="title-row"><h1>MATCH SUMMARY</h1><span class="badge">${final?'FINAL':'SPECIAL'}</span></div><p class="tournament">Prof. A. Thurairajah Memorial Cricket Tournament 2K26</p></div><div class="brand"><img src="images/tournamentLogo.png" alt="Tournament logo"><div class="year">2K26</div><div class="organizer">ORGANIZED BY E22</div></div></header><div class="match-title"><h2>${esc(m.innings[0].team)} <span>VS</span> ${esc(m.innings[1].team)}</h2><span>${esc(m.subtitle)}</span></div><div class="innings-grid">${m.innings.map(innings).join('')}</div><div class="winner">${trophy}<div><small>${final?'FINAL WINNER':'SPECIAL MATCH WINNER'}</small><strong>${esc(m.result)}</strong></div><div class="margin">${final?'E22: 162/9 · E23: 153/9':'Alumni: 116/5 · Present: 119/2'}<br>${final?'Both innings: 20 overs':'Chase completed in 11.5 overs'}</div></div><div class="footer"><span>${final?'FINAL · E22 VS E23':'SPECIAL MATCH · ALUMNI VS PRESENT'}</span><span>* NOT OUT</span></div>`;document.title=m.label+' | Match Summary';fit()}
function fit(){const scale=Math.min(1,Math.max(0.1,(window.innerWidth-(window.innerWidth<650?24:44))/1600));const height=document.getElementById('poster').offsetHeight;document.getElementById('stage').style.transform=`scale(${scale})`;document.getElementById('viewport').style.width=1600*scale+'px';document.getElementById('viewport').style.height=height*scale+'px'}
const picker=document.getElementById('picker');matches.forEach((m,i)=>picker.add(new Option(m.label,i)));picker.addEventListener('change',()=>{current=Number(picker.value);render()});
async function ready(){await document.fonts.ready;const images=[...document.querySelectorAll('#poster img')];await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})})));fit()}
function library(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Export library could not load. Check your internet connection.'));document.head.appendChild(s)})}
async function png(){const button=document.getElementById('png'),status=document.getElementById('status');button.disabled=true;status.textContent='Preparing high-resolution PNG...';try{await ready();if(!window.html2canvas)await library('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');document.body.classList.add('exporting');const poster=document.getElementById('poster');const canvas=await html2canvas(poster,{scale:2,useCORS:true,backgroundColor:'#0b0f19',width:1600,height:poster.offsetHeight,windowWidth:1644,scrollX:0,scrollY:0});const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG export failed.')),'image/png'));const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=matches[current].filename+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='PNG exported.'}catch(error){status.textContent=error.message}finally{document.body.classList.remove('exporting');button.disabled=false;fit()}}
function pageSize(){let style=document.getElementById('page-size');if(!style){style=document.createElement('style');style.id='page-size';document.head.appendChild(style)}style.textContent=`@page{size:1600px ${document.getElementById('poster').offsetHeight}px;margin:0}`}
async function pdf(){await ready();pageSize();document.getElementById('status').textContent='Choose Save as PDF; enable background graphics and disable browser headers and footers.';window.print()}
document.getElementById('png').addEventListener('click',png);document.getElementById('pdf').addEventListener('click',pdf);window.addEventListener('resize',fit);window.addEventListener('load',fit);window.addEventListener('beforeprint',pageSize);window.addEventListener('afterprint',fit);render();document.fonts.ready.then(fit);
</script>
</body>
</html>
